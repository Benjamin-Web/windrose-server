version: '3.8'

services:
  windrose-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: windrose-server:latest
    container_name: windrose-server
    restart: unless-stopped
    ports:
      - "7777:7777/udp"   # Game Port
      - "7778:7778/udp"   # Raw Packet Port  
      - "27015:27015"      # Query Port
    environment:
      - SERVER_NAME=Windrose Server
      - SERVER_PORT=7777
      - QUERY_PORT=27015
      - MAX_PLAYERS=16
      - GAME_PORT=7777
    volumes:
      - ./server-data:/windrose-server/saved
      - ./logs:/windrose-server/logs
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27015"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
