services:
  windrose-server:
    build: .
    image: windrose-server:latest
    container_name: windrose-server
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
      - "7778:7778/udp"
      - "27015:27015"
    environment:
      - SERVER_NAME=${SERVER_NAME:-Windrose Server}
      - SERVER_PORT=${SERVER_PORT:-7777}
      - QUERY_PORT=${QUERY_PORT:-27015}
      - MAX_PLAYERS=${MAX_PLAYERS:-16}
    volumes:
      - ./server-data:/home/steam/windrose
      - ./logs:/home/steam/windrose/logs
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
